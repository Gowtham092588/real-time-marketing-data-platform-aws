name: Wistia Glue CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "glue/wistia-api-ingestion.py"
      - ".github/workflows/wistia-glue-cicd.yml"

  pull_request:
    branches:
      - main
    paths:
      - "glue/wistia-api-ingestion.py"

permissions:
  id-token: write
  contents: read

jobs:

  validate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax
        run: |
          python -m py_compile glue/wistia-api-ingestion.py


  deploy:
    needs: validate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show GitHub OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          export OIDC_TOKEN=$(python -c \
            'import json,sys; print(json.load(sys.stdin)["value"])' \
            <<< "$RESPONSE")

          python - <<'PY'
          import os
          import json
          import base64

          token = os.environ["OIDC_TOKEN"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("aud =", claims.get("aud"))
          print("sub =", claims.get("sub"))
          print("repository =", claims.get("repository"))
          print("repository_id =", claims.get("repository_id"))
          print("repository_owner =", claims.get("repository_owner"))
          print("repository_owner_id =", claims.get("repository_owner_id"))
          print("ref =", claims.get("ref"))
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::229378727976:role/GitHubActionsWistiaGlueDeployRole
          aws-region: us-east-2
      
      